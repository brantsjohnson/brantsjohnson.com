<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Robot logo -->
  <rect x="0" y="10" width="40" height="40" rx="10" fill="url(#gradient)"/>
  <g fill="white">
    <!-- Robot head -->
    <rect x="10" y="20" width="20" height="15" rx="2" fill="white"/>
    <!-- Antenna -->
    <rect x="19" y="12" width="2" height="6" fill="white"/>
    <circle cx="20" cy="12" r="1.5" fill="white"/>
    <!-- Eyes -->
    <rect x="12" y="23" width="3" height="3" fill="url(#gradient)"/>
    <rect x="25" y="23" width="3" height="3" fill="url(#gradient)"/>
    <!-- Mouth -->
    <rect x="15" y="30" width="10" height="2" rx="1" fill="url(#gradient)"/>
  </g>
  
  <!-- BrantChat text -->
  <text x="50" y="35" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#1F2937">
    BrantChat
  </text>
</svg>
